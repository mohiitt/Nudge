services:
  postgres:
    image: postgres:16-alpine
    container_name: nudge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nudge}
      POSTGRES_DB: ${POSTGRES_DB:-nudge_support}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nudge_pg_data:/var/lib/postgresql/data
      - ./ingest/seed/postgres_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nudge} -d ${POSTGRES_DB:-nudge_support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: agent API (uses MOCK_MODE when secrets missing)
  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    container_name: nudge-agent
    env_file:
      - .env
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${AGENT_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nudge-web
    environment:
      NEXT_PUBLIC_AGENT_URL: ${NEXT_PUBLIC_AGENT_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - agent
    profiles:
      - full

volumes:
  nudge_pg_data:
